<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxelCraft — milestone 1: cube (preview)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #73a6e6; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 13px/1.5 ui-monospace, "JetBrains Mono", Consolas, monospace;
    color: rgba(255,255,255,.92); background: rgba(20,30,50,.55);
    padding: 10px 14px; border-radius: 8px; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  #hud b { color: #9fe08a; }
</style>
</head>
<body>
<div id="hud">
  <b>VoxelCraft</b> — milestone 1: static cube<br>
  Preview mirror of the native Vulkan build (<code>cargo run</code>)<br>
  Same camera, colors &amp; lighting as shaders/vert.glsl + frag.glsl
</div>
<canvas id="gl"></canvas>
<script>
"use strict";
// Faithful WebGL mirror of the raw-Vulkan milestone-1 renderer in src/main.rs:
//  - fixed camera at (1.6, 1.3, 2.2) looking at origin, 45° fov
//  - cube faces: grass-green top, dirt bottom, stone sides
//  - directional light (0.6, 0.8, 0.75), ambient 0.25, diffuse * 0.85
//  - sky-blue clear color (0.45, 0.65, 0.90)

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { antialias: true })
  || canvas.getContext("experimental-webgl");
if (!gl) {
  document.getElementById("hud").innerHTML =
    "<b>WebGL unavailable</b> — this browser context can't render the preview.";
  throw new Error("no webgl");
}

const VS = `
attribute vec3 aPos;
attribute vec3 aNormal;
attribute vec3 aColor;
uniform mat4 uMVP;
varying vec3 vNormal;
varying vec3 vColor;
void main() {
  gl_Position = uMVP * vec4(aPos, 1.0);
  vNormal = aNormal;
  vColor = aColor;
}`;

const FS = `
precision mediump float;
varying vec3 vNormal;
varying vec3 vColor;
void main() {
  vec3 lightDir = normalize(vec3(0.6, 0.8, 0.75));
  float diff = max(dot(normalize(vNormal), lightDir), 0.0);
  float ambient = 0.25;
  gl_FragColor = vec4(vColor * (ambient + diff * 0.85), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

// --- cube geometry (24 verts, 36 indices) — mirrors cube_vertices() in main.rs
const GRASS = [0.36, 0.55, 0.25], DIRT = [0.45, 0.32, 0.20], STONE = [0.58, 0.58, 0.60];
const h = 0.5;
const verts = [], idx = [];
function face(normal, color, corners) {
  const base = verts.length / 9;
  for (const c of corners) verts.push(...c, ...normal, ...color);
  idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
}
face([0, 1, 0], GRASS, [[-h, h, -h], [-h, h, h], [h, h, h], [h, h, -h]]);   // +Y top
face([0, -1, 0], DIRT, [[-h, -h, h], [-h, -h, -h], [h, -h, -h], [h, -h, h]]); // -Y bottom
face([1, 0, 0], STONE, [[h, -h, -h], [h, h, -h], [h, h, h], [h, -h, h]]);   // +X
face([-1, 0, 0], STONE, [[-h, -h, h], [-h, h, h], [-h, h, -h], [-h, -h, -h]]); // -X
face([0, 0, 1], STONE, [[-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h]]);   // +Z
face([0, 0, -1], STONE, [[h, -h, -h], [-h, -h, -h], [-h, h, -h], [h, h, -h]]); // -Z

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
const ibo = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(prog, "aPos");
const aNormal = gl.getAttribLocation(prog, "aNormal");
const aColor = gl.getAttribLocation(prog, "aColor");
const STRIDE = 9 * 4;
gl.enableVertexAttribArray(aPos);    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, STRIDE, 0);
gl.enableVertexAttribArray(aNormal); gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, STRIDE, 12);
gl.enableVertexAttribArray(aColor);  gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, STRIDE, 24);

// --- matrices (column-major, right-handed — matches glam's Mat4)
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) / (near - far), -1,
    0, 0, (2 * far * near) / (near - far), 0,
  ]);
}
function lookAt(eye, center, up) {
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const norm = (a) => { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const z = norm(sub(eye, center));           // backward
  const x = norm(cross(up, z));               // right
  const y = cross(z, x);                      // up
  return new Float32Array([
    x[0], y[0], z[0], 0,
    x[1], y[1], z[1], 0,
    x[2], y[2], z[2], 0,
    -(x[0]*eye[0] + x[1]*eye[1] + x[2]*eye[2]),
    -(y[0]*eye[0] + y[1]*eye[1] + y[2]*eye[2]),
    -(z[0]*eye[0] + z[1]*eye[1] + z[2]*eye[2]),
    1,
  ]);
}
function mul(a, b) { // a * b, column-major
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return o;
}

const uMVP = gl.getUniformLocation(prog, "uMVP");
gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.45, 0.65, 0.90, 1.0);

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(canvas.clientWidth * dpr);
  const hh = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== hh) {
    canvas.width = w; canvas.height = hh;
  }
  gl.viewport(0, 0, w, hh);
  const aspect = w / Math.max(1, hh);
  const proj = perspective(Math.PI / 4, aspect, 0.1, 100.0);
  const view = lookAt([1.6, 1.3, 2.2], [0, 0, 0], [0, 1, 0]);
  gl.uniformMatrix4fv(uMVP, false, mul(proj, view));
}

function frame() {
  resize();
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
